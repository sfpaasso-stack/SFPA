<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خريطة مواقع المراكز - جمعية تنظيم الأسرة السورية</title>

<!-- خط Cairo -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<!-- أيقونات FontAwesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- مكتبة الخرائط التفاعلية Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>

:root {
    --purple: #25005c;
    --orange: #f6511d;
    --text-dark: #222222;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Cairo', sans-serif;
    background: #f8f9fa;
    color: var(--text-dark);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

/* الهيدر */
header {
    background: linear-gradient(135deg, var(--purple), #3b008f);
    color: white;
    padding: 25px 20px;
    text-align: center;
    position: relative;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
}

.back-btn {
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255, 255, 255, 0.15);
    color: white;
    text-decoration: none;
    padding: 8px 16px;
    border-radius: 12px;
    font-weight: 600;
    transition: 0.3s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
}

.back-btn:hover {
    background: rgba(255, 255, 255, 0.3);
}

header h1 {
    font-size: 28px;
    margin-bottom: 4px;
}

header p {
    font-size: 15px;
    opacity: 0.9;
}

/* أدوات الفلترة في الخريطة */
.filter-bar {
    max-width: 1100px;
    width: 100%;
    margin: 20px auto 10px;
    padding: 0 20px;
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}

.filter-select {
    flex: 1;
    min-width: 200px;
    padding: 12px 15px;
    border-radius: 12px;
    border: 2px solid #e2e8f0;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    outline: none;
    background: white;
    cursor: pointer;
}

.filter-select:focus {
    border-color: var(--orange);
}

/* حاوية الخريطة */
.map-container {
    flex: 1;
    max-width: 1100px;
    width: 100%;
    margin: 0 auto 30px;
    padding: 0 20px;
}

#map {
    width: 100%;
    height: 550px;
    border-radius: 20px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
    z-index: 1;
}

/* الفوتر */
footer {
    background: var(--purple);
    color: white;
    text-align: center;
    padding: 15px;
    font-size: 14px;
    margin-top: auto;
}

@media (max-width: 600px) {
    .back-btn {
        position: static;
        display: inline-block;
        margin-bottom: 10px;
        transform: none;
    }
    #map {
        height: 400px;
    }
}

</style>
</head>

<body>

<header>
    <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-right"></i> الرئيسية</a>
    <h1>خريطة المراكز والعيادات</h1>
    <p>استعرض أماكن تواجد المراكز التابعة لجمعية تنظيم الأسرة السورية تفاعلياً</p>
</header>

<div class="filter-bar">
    <select class="filter-select" id="govFilter" onchange="filterMap()">
        <option value="all">كل المحافظات</option>
        <option value="دمشق">دمشق</option>
        <option value="ريف دمشق">ريف دمشق</option>
        <option value="حلب">حلب</option>
        <option value="حمص">حمص</option>
        <option value="حماه">حماه</option>
        <option value="اللاذقية">اللاذقية</option>
        <option value="طرطوس">طرطوس</option>
        <option value="درعا">درعا</option>
        <option value="السويداء">السويداء</option>
        <option value="القنيطرة">القنيطرة</option>
        <option value="دير الزور">دير الزور</option>
    </select>

    <select class="filter-select" id="typeFilter" onchange="filterMap()">
        <option value="all">جميع أنواع المراكز</option>
        <option value="عيادة ثابتة">عيادة ثابتة</option>
        <option value="مركز دعم وتمكين المرأة">مركز دعم وتمكين المرأة</option>
        <option value="مركز شباب">مركز شباب</option>
        <option value="مشفى">مشفى</option>
        <option value="مخبر">مخبر</option>
    </select>
</div>

<main class="map-container">
    <div id="map"></div>
</main>

<footer>
    SFPA © 2026
</footer>

    { name: "عيادة - الميادين", type: "عيادة ثابتة", gov: "دير الزور", location: "الميادين بالقرب من المحكمة", lat: 35.019259, lng: 40.453805 },
    { name: "مركز دعم وتمكين المرأة - دير الزور", type: "مركز دعم وتمكين المرأة", gov: "دير الزور", location: "بعاجين - جانب حديقة النصارى", lat: 35.33783016, lng: 40.13214137 }
];

// تهيئة الخريطة على سنتر سوريا
const map = L.map('map').setView([34.8021, 38.9968], 7);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
}).addTo(map);

let markersGroup = L.layerGroup().addTo(map);

function renderMarkers(data) {
    markersGroup.clearLayers();

    data.forEach(item => {
        if (item.lat && item.lng) {
            const popupContent = `
                <div style="font-family:'Cairo', sans-serif; text-align:right;">
                    <h4 style="color:#25005c; margin-bottom:5px;">${item.name}</h4>
                    <p style="font-size:12px; margin-bottom:5px;">📍 ${item.location}</p>
                    <a href="https://www.google.com/maps?q=${item.lat},${item.lng}" target="_blank" style="display:inline-block; background:#f6511d; color:white; padding:4px 10px; border-radius:6px; font-size:12px; text-decoration:none;">فتح في خرائط جوجل</a>
                </div>
            `;

            const marker = L.marker([item.lat, item.lng]).bindPopup(popupContent);
            markersGroup.addLayer(marker);
        }
    });
}

function filterMap() {
    const selectedGov = document.getElementById('govFilter').value;
    const selectedType = document.getElementById('typeFilter').value;

    const filtered = locationsData.filter(item => {
        const matchesGov = (selectedGov === 'all' || item.gov === selectedGov);
        const matchesType = (selectedType === 'all' || item.type === selectedType);
        return matchesGov && matchesType;
    });

    renderMarkers(filtered);
}

// عرض جميع النقاط عند البداية
renderMarkers(locationsData);

</script>

</html>
