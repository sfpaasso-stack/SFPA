<!-- استدعاء خط Cairo الاحترافي -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

:root {
    --purple: #25005c;
    --orange: #f6511d;
    --text-dark: #222222;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Cairo', sans-serif;
    background: #f8f9fa;
    color: var(--text-dark);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

/* الهيدر والعنوان */
header {
    background: linear-gradient(135deg, var(--purple), #3b008f);
    color: white;
    padding: 30px 20px;
    text-align: center;
    position: relative;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
}

.back-btn {
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255, 255, 255, 0.15);
    color: white;
    text-decoration: none;
    padding: 8px 16px;
    border-radius: 12px;
    font-weight: 600;
    transition: 0.3s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
}

.back-btn:hover {
    background: rgba(255, 255, 255, 0.3);
}

header h1 {
    font-size: 32px;
    margin-bottom: 5px;
}

header p {
    font-size: 16px;
    opacity: 0.9;
}

/* المحتوى الرئيسي */
main {
    flex: 1;
    max-width: 1000px;
    width: 100%;
    margin: 30px auto;
    padding: 0 20px;
}

.step-title {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 15px;
    color: var(--purple);
    border-right: 4px solid var(--orange);
    padding-right: 10px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.step-num {
    background: var(--purple);
    color: white;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    display: inline-flex;
    justify-content: center;
    align-items: center;
    font-size: 14px;
}

/* شبكة اختيار نوع المركز بالأيقونات */
.type-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 30px;
}

.type-btn {
    background: white;
    border: 2px solid #e2e8f0;
    padding: 16px 12px;
    border-radius: 16px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    color: var(--text-dark);
    cursor: pointer;
    transition: all 0.25s ease;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
}

.type-btn i {
    font-size: 26px;
    color: var(--purple);
    transition: color 0.25s ease;
}

.type-btn:hover {
    border-color: var(--orange);
    color: var(--orange);
    transform: translateY(-2px);
}

.type-btn:hover i {
    color: var(--orange);
}

.type-btn.active {
    background: var(--purple);
    color: white;
    border-color: var(--purple);
    box-shadow: 0 6px 15px rgba(37, 0, 92, 0.25);
}

.type-btn.active i {
    color: white;
}

/* شبكة المحافظات */
.gov-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 10px;
    margin-bottom: 30px;
}

.gov-btn {
    background: white;
    border: 2px solid #e2e8f0;
    padding: 12px 10px;
    border-radius: 14px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    color: var(--text-dark);
    cursor: pointer;
    transition: all 0.25s ease;
}

.gov-btn:hover {
    border-color: var(--orange);
    color: var(--orange);
}

.gov-btn.active {
    background: var(--orange);
    color: white;
    border-color: var(--orange);
    box-shadow: 0 4px 12px rgba(246, 81, 29, 0.3);
}

/* حاوية عرض المراكز والعيادات */
.results-container {
    background: white;
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
    min-height: 180px;
}

.center-card {
    border-bottom: 1px solid #f0f0f0;
    padding: 18px 0;
}

.center-card:last-child {
    border-bottom: none;
}

.center-info h3 {
    font-size: 18px;
    color: var(--purple);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.center-info h3 i {
    color: var(--orange);
}

.center-info p {
    font-size: 14px;
    color: #555;
    margin-bottom: 4px;
    display: flex;
    align-items: flex-start;
    gap: 8px;
}

.center-info p i {
    margin-top: 4px;
    color: var(--purple);
}

.placeholder-text {
    text-align: center;
    color: #888;
    padding: 40px 0;
    font-size: 15px;
}

/* الفوتر */
footer {
    background: var(--purple);
    color: white;
    text-align: center;
    padding: 15px;
    font-size: 14px;
    margin-top: auto;
}

@media (max-width: 600px) {
    .back-btn {
        position: static;
        display: inline-block;
        margin-bottom: 10px;
        transform: none;
    }
}

</style>
</head>

</main>

function selectGov(gov, btnElement) {
    currentGov = gov;

    document.querySelectorAll('.gov-btn').forEach(b => b.classList.remove('active'));
    btnElement.classList.add('active');

    const resultsContainer = document.getElementById('resultsContainer');

    // العيادة المتنقلة
    if (currentType === "عيادة متنقلة") {
        const mobileData = db.find(item => item.type === "عيادة متنقلة" && item.gov === gov);
        
        if (mobileData) {
            resultsContainer.innerHTML = `
                <div class="center-card">
                    <div class="center-info">
                        <h3><i class="fa-solid fa-truck-medical"></i> ${mobileData.name}</h3>
                        <p><i class="fa-solid fa-route"></i> <strong>نطاق التغطية:</strong> تغطي مناطق وقرى محافظة ${gov} والأرياف البعيدة حسب خطة الانتشار الميداني.</p>
                        <p><i class="fa-regular fa-calendar-check"></i> <strong>جدول الجولات الميدانية:</strong> من الأحد إلى الخميس (9:00 صباحاً – 3:00 عصراً)</p>
                    </div>
                </div>
            `;
        } else {
            resultsContainer.innerHTML = `
                <div class="placeholder-text">
                    <i class="fa-solid fa-circle-info" style="font-size:24px; color:var(--orange); margin-bottom:10px; display:block;"></i>
                    لا تتواجد فرق عيادات متنقلة حالياً في محافظة <strong>${gov}</strong>.
                </div>
            `;
        }
        return;
    }

    // المراكز الثابتة وبقية الخدمات بدون زِر خريطة
    const filteredCenters = db.filter(item => item.type === currentType && item.gov === gov);

    if (filteredCenters.length === 0) {
        resultsContainer.innerHTML = `<div class="placeholder-text">لا توجد نتائج مطابقة.</div>`;
        return;
    }

    let html = '';
    filteredCenters.forEach(center => {
        html += `
            <div class="center-card">
                <div class="center-info">
                    <h3><i class="fa-solid fa-building-circle-check"></i> ${center.name}</h3>
                    <p><i class="fa-solid fa-location-dot"></i> ${center.location}</p>
                </div>
            </div>
        `;
    });

    resultsContainer.innerHTML = html;
}
