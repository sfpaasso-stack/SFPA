<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>جمعية تنظيم الأسرة السورية</title>

<style>

:root{
    --purple:#25005c;
    --purple-light:#4b1da6;
    --orange:#f6511d;
    --orange-light:#ff7c46;
    --white:#ffffff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Tahoma, Arial, sans-serif;
    background:#f7f7fb;
}

/* القسم الرئيسي */

.hero{

    min-height:85vh;

    background:
    linear-gradient(
    rgba(37,0,92,0.65),
    rgba(37,0,92,0.65)
    ),
    url("CHBACK.png");

    background-size:cover;
    background-position:center;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;
    padding:40px 20px;

}

/* الشعار */

.logo-box{

    background:white;
    padding:20px;

    border-radius:25px;

    box-shadow:
    0 10px 35px rgba(0,0,0,.25);

    margin-bottom:30px;

}

.logo{

    width:600px;
    max-width:90vw;
    height:auto;
    display:block;

}

.hero h1{

    color:white;
    font-size:48px;
    margin-bottom:10px;

}

.hero p{

    color:white;
    font-size:24px;

}

/* البطاقات */

.cards{

    width:100%;
    max-width:1200px;

    margin:-70px auto 60px;
    padding:0 20px;

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:25px;

}

.card{

    color:white;

    text-decoration:none;

    border-radius:22px;

    padding:35px 25px;

    text-align:center;

    box-shadow:
    0 10px 25px rgba(0,0,0,.15);

    transition:0.3s;

}

.card:hover{

    transform:translateY(-8px);

}

.icon{

    font-size:55px;
    display:block;
    margin-bottom:15px;

}

.card-title{

    font-size:24px;
    font-weight:bold;

}

.clinics{
    background:var(--purple);
}

.locations{
    background:var(--purple-light);
}

.services{
    background:var(--orange);
}

.contact{
    background:var(--orange-light);
}

footer{

    background:var(--purple);

    color:white;

    text-align:center;

    padding:20px;

}
