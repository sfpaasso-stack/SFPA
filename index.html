<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>جمعية تنظيم الأسرة السورية</title>

<style>

:root{
    --purple:#25005c;
    --purple-light:#4b1da6;
    --orange:#f6511d;
    --orange-light:#ff7c46;
    --white:#ffffff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Tahoma, Arial, sans-serif;
    background:#f7f7f7;
}

.hero{
     min-height:65vh;

    background:
    linear-gradient(
    rgba(0,0,0,0.45),
    rgba(0,0,0,0.45)
    ),
    url("final logo.jpg");

    background-size:80%;
    background-position:center;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;
    padding:40px 20px;
}

.logo{
    width:420px;
    max-width:90%;
    margin-bottom:25px;
}

.hero h1{
    font-size:42px;
    margin-bottom:10px;
}

.hero p{
    font-size:22px;
    margin-bottom:30px;
}

.cards{
    max-width:1200px;
    margin:-70px auto 50px;
    padding:0 20px;

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.card{
    background:white;
    border-radius:20px;
    padding:30px;
    text-align:center;
    box-shadow:0 8px 20px rgba(0,0,0,0.12);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-8px);
}

.card a{
    text-decoration:none;
    color:#2c0a6b;
    font-size:22px;
    font-weight:bold;
}

.icon{
    font-size:50px;
    display:block;
    margin-bottom:15px;
}

footer{
    background:#2c0a6b;
    color:white;
    text-align:center;
    padding:20px;
}

</style>

</head>

<body>

<section class="hero">

<p>
بوابة المراكز والخدمات الطبية
</p>

</section>

<div class="cards">

<div class="card">
clinics.html
<span class="icon">🩺</span>
العيادات
</a>
</div>

<div class="card">
locations.html
<span class="icon">📍</span>
مواقع المراكز
</a>
</div>

<div class="card">
services.html
<span class="icon">🏥</span>
الخدمات
</a>
</div>

<div class="card">
contact.html
<span class="icon">📞</span>
اتصل بنا
</a>
</div>

</div>

<footer>
SFPA © 2026
</footer>

</body>

</html>
