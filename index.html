<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>جمعية تنظيم الأسرة السورية</title>

<style>

:root{
    --purple:#25005c;
    --purple-light:#4c1d95;
    --orange:#f6511d;
    --orange-light:#ff7f50;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Tahoma, Arial, sans-serif;
    background:#f5f5f5;
}

/* الخلفية الرئيسية */

.hero{

    position:relative;

    height:600px;

    background:
    linear-gradient(
        rgba(37,0,92,.45),
        rgba(37,0,92,.45)
    ),
    url("CHBACK.png");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    color:white;
}

/* اللوغو */

.logo-corner{

    position:absolute;

    top:20px;
    right:20px;

    background:white;

    padding:12px;

    border-radius:15px;

    box-shadow:0 5px 20px rgba(0,0,0,.2);
}

.logo-corner img{

    width:180px;

    display:block;
}

/* العنوان */

.hero h1{

    font-size:52px;

    margin-bottom:15px;

    text-shadow:0 3px 10px rgba(0,0,0,.5);
}

.hero p{

    font-size:24px;

    text-shadow:0 3px 10px rgba(0,0,0,.5);
}

/* الصناديق */

.cards{

    max-width:1200px;

    margin:-60px auto 50px;

    padding:0 20px;

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));

    gap:25px;
}

.card{

    padding:35px;

    border-radius:20px;

    text-decoration:none;

    color:white;

    text-align:center;

    box-shadow:
    0 10px 25px rgba(0,0,0,.15);

    transition:.3s;
}

.card:hover{

    transform:translateY(-10px);
}

.icon{

    font-size:55px;

    margin-bottom:15px;
}

.card-title{

    font-size:24px;

    font-weight:bold;
}

/* ألوان الهوية */

.clinics{
    background:#25005c;
}

.locations{
    background:#4c1d95;
}

.services{
    background:#f6511d;
}

.contact{
    background:#ff7f50;
}

/* الفوتر */

footer{

    background:#25005c;

    color:white;

    text-align:center;

    padding:20px;
}

/* الموبايل */

@media(max-width:768px){

.hero{

    height:500px;
}

.logo-corner img{

    width:120px;
}

.hero h1{

    font-size:30px;
}

.hero p{

    font-size:18px;
}

}

</style>

</head>

<body>

<section class="hero">

    <div class="logo-corner">
        final logo.jpg
    </div>

    <h1>جمعية تنظيم الأسرة السورية</h1>

    <p>بوابة المراكز والخدمات الطبية</p>

</section>

<div class="cards">

    clinics.html
        <div class="icon">🩺</div>
        <div class="card-title">العيادات</div>
    </a>

    locations.html
        <div class="icon">📍</div>
        <div class="card-title">مواقع المراكز</div>
    </a>

    services.html
        <div class="icon">🏥</div>
        <div class="card-title">الخدمات</div>
    </a>

    contact.html
        <div class="icon">📞</div>
        <div class="card-title">اتصل بنا</div>
    </a>

</div>

<footer>
SFPA © 2026
</footer>

</body>

</html>
