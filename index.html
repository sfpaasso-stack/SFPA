<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>جمعية تنظيم الأسرة السورية</title>

<style>

:root{
    --purple:#25005c;
    --purple2:#4c1d95;
    --orange:#f6511d;
    --orange2:#ff7f50;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Tahoma, Arial, sans-serif;
    background:#f7f7f7;
}

/* الخلفية الرئيسية */

.hero{

    position:relative;

    height:650px;      /* ارتفاع الخلفية */

    background:
    linear-gradient(
        rgba(37,0,92,0.45),
        rgba(37,0,92,0.45)
    ),
    url("CHBACK.png");

    background-size:cover;      /* حجم الصورة */
    background-position:center; /* مكان الصورة */
    background-repeat:no-repeat;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    color:white;
}

/* الشعار */

.logo-corner{

    position:absolute;

    top:20px;
    right:20px;

    background:white;

    padding:10px;

    border-radius:15px;

    box-shadow:0 5px 20px rgba(0,0,0,.25);

}

.logo-corner img{

    width:220px;   /* حجم الشعار */

    height:auto;

    display:block;
}

.hero h1{

    font-size:48px;
    margin-bottom:15px;

    text-shadow:0 2px 10px rgba(0,0,0,.4);
}

.hero p{

    font-size:24px;

    text-shadow:0 2px 10px rgba(0,0,0,.4);
}

/* البطاقات */

.cards{

    max-width:1200px;

    margin:-60px auto 60px;

    padding:0 20px;

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(240px,1fr));

    gap:25px;
}

.card{

    border-radius:20px;

    padding:35px;

    color:white;

    text-decoration:none;

    text-align:center;

    box-shadow:0 10px 25px rgba(0,0,0,.15);

    transition:.3s;
}

.card:hover{

    transform:translateY(-8px);
}

.icon{

    font-size:55px;

    display:block;

    margin-bottom:15px;
}

.card-title{

    font-size:24px;

    font-weight:bold;
}

/* ألوان من روح الشعار */

.clinics{
    background:#25005c;
}

.locations{
    background:#4c1d95;
}

.services{
    background:#f6511d;
}

.contact{
    background:#ff7f50;
}

footer{

    background:#25005c;

    color:white;

    text-align:center;

    padding:20px;
}

@media(max-width:768px){

.hero{
    height:500px;
}

.logo-corner img{
    width:150px;
}

.hero h1{
    font-size:30px;
}

.hero p{
    font-size:18px;
}

}

</style>

</head>

<body>

<section class="hero">

    <div class="final logo.jpg">
        final logo.jpg
    </div>

    <h1>جمعية تنظيم الأسرة السورية</h1>

    <p>بوابة المراكز والخدمات الطبية</p>

</section>

<div class="cards">

    clinics
        <span class="icon">🩺</span>
        <div class="card-title">العيادات</div>
    </a>

    locations
        <span class="icon">📍</span>
        <div class="card-title">مواقع المراكز</div>
    </a>

    services
        <span class="icon">🏥</span>
        <div class="card-title">الخدمات</div>
    </a>

    contact
        <span class="icon">📞</span>
        <div class="card-title">اتصل بنا</div>
    </a>

</div>

<footer>
SFPA © 2026
</footer>

</body>
</html>
