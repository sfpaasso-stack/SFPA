<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>جمعية تنظيم الأسرة السورية</title>

<style>

:root{
    --purple:#25005c;
    --purple-light:#4c1d95;
    --orange:#f6511d;
    --orange-light:#ff7f50;
    --card-text: #222222; /* لون الخط الداكن للكروت */
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Tahoma, Arial, sans-serif;
    background:#f5f5f5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

/* الخلفية الرئيسية وتغطية الشاشة كاملاً */

.hero{
    position:relative;
    flex: 1;
    min-height: calc(100vh - 50px); /* تأخذ معظم ارتفاع الشاشة عدا الفوتر البسيط */

    background:
    linear-gradient(
        rgba(37,0,92,.15), /* الشفافية خفيفة جداً لظهور الصورة بوضوح */
        rgba(37,0,92,.15)
    ),
    url("CHBACK.png");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    color:white;
    padding: 20px;
}

/* اللوغو */

.logo-corner{
    position:absolute;
    top:20px;
    left:20px;
    z-index:3;
    background:white;
    padding:12px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.2);
}

.logo-corner img{
    width:180px;
    height:auto;
    display:block;
}

/* العنوان */

.hero h1{
    font-size:52px;
    margin-bottom:15px;
    text-shadow:0 3px 10px rgba(0,0,0,.6);
}

.hero p{
    font-size:24px;
    text-shadow:0 3px 10px rgba(0,0,0,.6);
}

/* الصناديق/الكروت */

.cards{
    position:relative;
    z-index:2;
    width: 100%;
    max-width:1200px;
    margin: 40px auto 20px;
    padding:0 20px;
    display:grid;
    grid-template-columns: repeat(auto-fit,minmax(200px,1fr));
    gap:25px;
}

.card{
    display:flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding:30px 20px;
    border-radius:20px;
    text-decoration:none;
    color: var(--card-text); /* تم تغيير لون الخط إلى الأسود */
    background: white;
    text-align:center;
    box-shadow: 0 10px 25px rgba(0,0,0,.2);
    transition:.3s;
}

.card:hover{
    transform:translateY(-8px);
    box-shadow: 0 15px 30px rgba(0,0,0,.3);
}

.icon{
    font-size:45px;
    margin-bottom:12px;
    color: var(--card-text); /* لون الأيقونة بالأسود */
}

.card-title{
    font-size:20px;
    font-weight:bold;
    color: var(--card-text); /* لون عنوان الكرت بالأسود */
}

/* الفوتر البسيط أسفل الشاشة */

footer{
    background:#25005c;
    color:white;
    text-align:center;
    padding:12px 20px;
    font-size: 14px;
}

/* الموبايل */

@media(max-width:768px){

.logo-corner img{
    width:120px;
}

.hero h1{
    font-size:30px;
}

.hero p{
    font-size:18px;
}

.cards{
    margin-top: 25px;
}

}

</style>

</head>

<body>

<section class="hero">

    <div class="logo-corner">
        <img src="final%20logo.jpg" alt="شعار جمعية تنظيم الأسرة السورية">
    </div>

    <h1>جمعية تنظيم الأسرة السورية</h1>

    <p>بوابة المراكز والخدمات الطبية</p>

    <div class="cards">

        <a href="clinics.html" class="card">
            <div class="icon">🩺</div>
            <div class="card-title">العيادات</div>
        </a>

        <a href="locations.html" class="card">
            <div class="icon">📍</div>
            <div class="card-title">مواقع المراكز</div>
        </a>

        <a href="services.html" class="card">
            <div class="icon">🏥</div>
            <div class="card-title">الخدمات</div>
        </a>

        <a href="contact.html" class="card">
            <div class="icon">📞</div>
            <div class="card-title">اتصل بنا</div>
        </a>

    </div>

</section>

<footer>
SFPA © 2026
</footer>

</body>

</html>
