<title>جمعية تنظيم الأسرة السورية</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Tahoma, Arial;
background:#f5f5f5;
}

.hero{
height:70vh;
background-image:
linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),
url("hero.jpg");
background-size:cover;
background-position:center;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
color:white;
}

.logo{
width:320px;
max-width:90%;
margin-bottom:20px;
}

.hero h1{
font-size:42px;
margin-bottom:10px;
}

.hero p{
font-size:20px;
}

.container{
max-width:1200px;
margin:auto;
padding:50px 20px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:25px;
}

.card{
background:white;
padding:30px;
border-radius:20px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.1);
transition:0.3s;
}

.card:hover{
transform:translateY(-8px);
}

.card a{
text-decoration:none;
font-size:22px;
font-weight:bold;
color:#2d005f;
}

footer{
background:#2d005f;
color:white;
text-align:center;
padding:20px;
margin-top:40px;
}

</style>

</head>
