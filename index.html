<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>جمعية تنظيم الأسرة السورية</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Tahoma, Arial, sans-serif;
    background:#f7f7f7;
}

.hero{
    min-height:75vh;
    background:
    linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
    url("final logo.jpg");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;
    color:white;
    padding:20px;
}

.logo{
    width:420px;
    max-width:90%;
    margin-bottom:25px;
}

.hero h1{
    font-size:42px;
    margin-bottom:10px;
}

.hero p{
    font-size:22px;
    margin-bottom:30px;
}

.cards{
    max-width:1200px;
    margin:-70px auto 50px;
    padding:0 20px;

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.card{
    background:white;
    border-radius:20px;
    padding:30px;
    text-align:center;
    box-shadow:0 8px 20px rgba(0,0,0,0.12);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-8px);
}

.card a{
    text-decoration:none;
    color:#2c0a6b;
    font-size:22px;
    font-weight:bold;
}

.icon{
    font-size:50px;
    display:block;
    margin-bottom:15px;
}

footer{
    background:#2c0a6b;
    color:white;
    text-align:center;
    padding:20px;
}

</style>

</head>

<body>

<section class="hero">

final logo.jpg

<h1>جمعية تنظيم الأسرة السورية</h1>

<p>
بوابة المراكز والخدمات الطبية
</p>

</section>

<div class="cards">

<div class="card">
Clinics
<span class="icon">🩺</span>
العيادات
</a>
</div>

<div class="card">
Locations
<span class="icon">📍</span>
مواقع المراكز
</a>
</div>

<div class="card">
Services
<span class="icon">🏥</span>
الخدمات
</a>
</div>

<div class="card">
Contact
<span class="icon">📞</span>
اتصل بنا
</a>
</div>

</div>

<footer>
SFPA © 2026 - Ali issa
</footer>

</body>

</html>
