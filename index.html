<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جمعية تنظيم الأسرة السورية</title>

<!-- استدعاء خط Cairo الاحترافي من Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

:root {
    --purple: #25005c;
    --orange: #f6511d;
    --card-text: #1f1f1f;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Cairo', sans-serif;
    background: #11002c;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

/* الخلفية الرئيسية */
.hero {
    position: relative;
    flex: 1;
    min-height: calc(100vh - 45px);
    background: 
        linear-gradient(
            to bottom,
            rgba(37, 0, 92, 0.25),
            rgba(37, 0, 92, 0.45)
        ),
        url("CHBACK.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: white;
    padding: 20px;
}

/* اللوغو مع لمسة انسيابية */
.logo-corner {
    position: absolute;
    top: 25px;
    left: 25px;
    z-index: 3;
    background: rgba(255, 255, 255, 0.95);
    padding: 10px 15px;
    border-radius: 16px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
    backdrop-filter: blur(5px);
    transition: transform 0.3s ease;
}

.logo-corner:hover {
    transform: scale(1.03);
}

.logo-corner img {
    width: 160px;
    height: auto;
    display: block;
}

/* عناوين الصفحة بتأثير حركي */
.hero h1 {
    font-size: 54px;
    font-weight: 800;
    margin-bottom: 10px;
    text-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
    animation: fadeInDown 1s ease forwards;
}

.hero p {
    font-size: 22px;
    font-weight: 600;
    opacity: 0.95;
    text-shadow: 0 3px 10px rgba(0, 0, 0, 0.7);
    margin-bottom: 20px;
    animation: fadeInUp 1s ease forwards;
}

/* شبكة الكروت بتأثير الزجاج المضبب (Glassmorphism) */
.cards {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 1100px;
    margin-top: 30px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 20px;
    animation: fadeInUp 1.2s ease forwards;
}

.card {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 28px 15px;
    border-radius: 24px;
    text-decoration: none;
    color: var(--card-text);
    
    /* خلفية زجاجية مضببة */
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.6);
    
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}

.card:hover {
    transform: translateY(-10px) scale(1.02);
    background: rgba(255, 255, 255, 0.98);
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
}

.icon {
    font-size: 48px;
    margin-bottom: 10px;
    transition: transform 0.3s ease;
}

.card:hover .icon {
    transform: scale(1.15);
}

.card-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--card-text);
}

/* الفوتر البسيط */
footer {
    background: var(--purple);
    color: rgba(255, 255, 255, 0.85);
    text-align: center;
    padding: 12px 20px;
    font-size: 14px;
    letter-spacing: 1px;
}

/* حركات الظهور (Animations) */
@keyframes fadeInDown {
    from {
        opacity: 0;
        transform: translateY(-20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* تجاوب الشاشات الصغيرة */
@media (max-width: 768px) {
    .logo-corner {
        top: 15px;
        left: 15px;
    }
    .logo-corner img {
        width: 110px;
    }
    .hero h1 {
        font-size: 32px;
    }
    .hero p {
        font-size: 17px;
    }
    .cards {
        gap: 15px;
    }
}

</style>
</head>

<body>

<section class="hero">

    <div class="logo-corner">
        <img src="final%20logo.jpg" alt="شعار جمعية تنظيم الأسرة السورية">
    </div>

    <h1>جمعية تنظيم الأسرة السورية</h1>
    <p>بوابة المراكز والخدمات الطبية</p>

    <div class="cards">
        <a href="clinics.html" class="card">
            <div class="icon">🩺</div>
            <div class="card-title">العيادات</div>
        </a>

        <a href="locations.html" class="card">
            <div class="icon">📍</div>
            <div class="card-title">مواقع المراكز</div>
        </a>

        <a href="services.html" class="card">
            <div class="icon">🏥</div>
            <div class="card-title">الخدمات</div>
        </a>

        <a href="contact.html" class="card">
            <div class="icon">📞</div>
            <div class="card-title">اتصل بنا</div>
        </a>
    </div>

</section>

<footer>
    SFPA © 2026
</footer>

</body>
</html>
