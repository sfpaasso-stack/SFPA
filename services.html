<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خدماتنا - جمعية تنظيم الأسرة السورية</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

:root {
    --purple: #25005c;
    --orange: #f6511d;
    --text-dark: #222222;
    --green-badge: #2e7d32;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Cairo', sans-serif;
    background: #f8f9fa;
    color: var(--text-dark);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

/* الهيدر والعنوان */
header {
    background: linear-gradient(135deg, var(--purple), #3b008f);
    color: white;
    padding: 35px 20px;
    text-align: center;
    position: relative;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
}

.back-btn {
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255, 255, 255, 0.15);
    color: white;
    text-decoration: none;
    padding: 8px 16px;
    border-radius: 12px;
    font-weight: 600;
    transition: 0.3s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
}

.back-btn:hover {
    background: rgba(255, 255, 255, 0.3);
}

header h1 {
    font-size: 32px;
    margin-bottom: 6px;
}

header p {
    font-size: 16px;
    opacity: 0.92;
}

/* المحتوى الرئيسي */
main {
    flex: 1;
    max-width: 1100px;
    width: 100%;
    margin: 30px auto;
    padding: 0 20px;
}

/* أزرار التصفية السريعة */
.categories-filter {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 35px;
}

.cat-btn {
    background: white;
    border: 2px solid #e2e8f0;
    padding: 10px 20px;
    border-radius: 30px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    color: var(--text-dark);
    cursor: pointer;
    transition: all 0.25s ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.03);
}

.cat-btn i {
    color: var(--purple);
}

.cat-btn:hover {
    border-color: var(--orange);
    color: var(--orange);
}

.cat-btn.active {
    background: var(--purple);
    color: white;
    border-color: var(--purple);
    box-shadow: 0 6px 15px rgba(37, 0, 92, 0.2);
}

.cat-btn.active i {
    color: white;
}

/* شبكة الكروت */
.services-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 25px;
}

.service-card {
    background: white;
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.05);
    border: 1px solid #edf2f7;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    position: relative;
}

.service-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
}

/* الوسم المجاني */
.free-badge {
    position: absolute;
    top: 20px;
    left: 20px;
    background: #e8f5e9;
    color: var(--green-badge);
    border: 1px solid #c8e6c9;
    font-size: 12px;
    font-weight: 800;
    padding: 4px 12px;
    border-radius: 20px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
}

.service-header {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 15px;
}

.service-icon {
    width: 55px;
    height: 55px;
    border-radius: 16px;
    background: rgba(37, 0, 92, 0.08);
    color: var(--purple);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 24px;
    flex-shrink: 0;
}

.service-title {
    font-size: 20px;
    font-weight: 800;
    color: var(--purple);
    line-height: 1.3;
    padding-left: 60px; /* مسافة تجنباً للتداخل مع الوسم */
}

.service-list {
    list-style: none;
    margin-bottom: 20px;
    flex: 1;
}

.service-list li {
    font-size: 14px;
    color: #4a5568;
    margin-bottom: 10px;
    display: flex;
    align-items: flex-start;
    gap: 8px;
    line-height: 1.5;
}

.service-list li i {
    color: var(--orange);
    margin-top: 4px;
    font-size: 12px;
}

/* زر البحث عن المركز */
.find-clinic-btn {
    background: var(--purple);
    color: white;
    text-decoration: none;
    text-align: center;
    padding: 12px 18px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
    transition: background 0.3s ease;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin-top: auto;
}

.find-clinic-btn:hover {
    background: var(--orange);
}

/* الفوتر */
footer {
    background: var(--purple);
    color: white;
    text-align: center;
    padding: 15px;
    font-size: 14px;
    margin-top: auto;
}

    .back-btn {
        position: static;
        display: inline-block;
        margin-bottom: 12
